services:
  mongo:
    image: mongo:7
    container_name: buildflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buildflow-net

  redis:
    image: redis:7-alpine
    container_name: buildflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - buildflow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildflow-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Force the Docker-internal service names regardless of what a
      # developer's local .env happens to say, so this always works
      # inside Compose networking.
      MONGO_URI: mongodb://mongo:27017/buildflow
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/v1/healthcheck', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - buildflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - buildflow-net

networks:
  buildflow-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  backend_uploads:
